<div class="v-flex">
    <p-toolbar>
        <ng-template #start>
            <div class="table-title">
                {{ table.getTitle('Протоколы') }}
            </div>

            <div class="splitter"></div>

            <p-button icon="pi pi-plus"
                      size="small"
                      severity="success"
                      pTooltip="Добавить протокол"
                      (onClick)="createProtocol()">
            </p-button>

            <div class="splitter"></div>

            <p-button size="small"
                      severity="success"
                      icon="pi pi-file-excel"
                      [disabled]="loading()"
                      (onClick)="table.exportToExcel()">
            </p-button>
        </ng-template>

        <ng-template #end>
            <pro-legacy-table-fast-search [table]="table">
            </pro-legacy-table-fast-search>
        </ng-template>
    </p-toolbar>
    <pro-legacy-table #table
                      class="v-flex-grow"
                      [defaultSort]="[{field: 'id', order: -1}]"
                      [columns]="columns()"
                      [value]="protocols()"
                      [checkboxSelection]="false"
                      [(selection)]="selectedProtocol"
                      [filter]="filter()"
                      [loading]="loading()"
                      [getRowId]="getRowId">
    </pro-legacy-table>
</div>
