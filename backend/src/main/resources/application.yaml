    name: atom-2027
  jpa:
    properties:
      hibernate:
        default_schema: ${app.db-schema}
        show_sql: true
        hbm2ddl:
          create_namespaces: true
          auto: create
  datasource:
    url: jdbc:postgresql://localhost:5496/postgres?currentSchema=${app.db-schema}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
management:
