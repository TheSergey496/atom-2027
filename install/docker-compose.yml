services:
  db:
    image: postgres:18.6-alpine
    container_name: db
    ports:
      - "${DB_PORT:-5496}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    image: localhost:5000/backend
    container_name: backend
    build:
      dockerfile: ../Dockerfile
      target: backend
    environment:
      APP_DB_SCHEMA: &schema "atom_2027"
      app.db-schema: *schema
      server.port: 8085
      spring.datasource.url: "jdbc:postgresql://db:5432/postgres?currentSchema=$${APP_DB_SCHEMA}"
      app.dynamic-datasources.secondary.url: "jdbc:postgresql://db:5432/postgres?currentSchema=dummy_schema"
      app.dynamic-datasources.secondary.username: postgres
      app.dynamic-datasources.secondary.password: postgres
    ports:
      - "${BACKEND_PORT:-8496}:8085"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -s -o /tmp/h -w '%{http_code}' http://127.0.0.1:8085/actuator/health > /tmp/code;
          cat /tmp/h;
          [ "$(cat /tmp/code)" = "200" ]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s

  frontend:
    image: localhost:5000/frontend
    container_name: frontend
    build:
      dockerfile: ../Dockerfile
      target: frontend
    environment:
      baseUrl: http://${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8496}
    ports:
      - "${FRONTEND_PORT:-4963}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s