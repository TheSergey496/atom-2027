@if (loading()) {
  <pro-legacy-loader></pro-legacy-loader>
} @else {
  <main>
    <pro-legacy-header></pro-legacy-header>
    <router-outlet></router-outlet>
  </main>
}

<p-toast [breakpoints]="{'720px': {width: '100%', right: '0', left: '0'}}"></p-toast>

<p-toast position="center" key="{{MessageServiceKey.OK}}" class="toast-ok-wrapper">
  <ng-template let-message pTemplate="message">
    <div class="toast-ok">
      <div>
        <i [class]="getToastIconClass(message)" style="font-size: 3em"></i>
        <div class="toast-ok-summary">{{ message.summary }}</div>
        <p-scrollpanel [class]="'toast-ok-detail-scroll'">
          <p class="toast-ok-detail">{{ message.detail }}</p>
        </p-scrollpanel>
      </div>

      <div>
        <p-button label="OK" [severity]="getSeverity(message)"
                  (click)="onToastButtonClick()">
        </p-button>
      </div>
    </div>

    <p-blockUI proLegacyBlockedForLive></p-blockUI>
  </ng-template>
</p-toast>
