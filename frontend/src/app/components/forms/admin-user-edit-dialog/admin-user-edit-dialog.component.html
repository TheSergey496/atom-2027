<p-dialog [header]="header()" [style]="{ width: '480px' }" [modal]="true">

  <div style="height: 10px"></div>
  <pro-legacy-user-edit-form [mode]="mode()"
                             [user]="user"
                             [roles]="roles()"
                             (validityChange)="formValid = $event">
  </pro-legacy-user-edit-form>

  <ng-template #footer>
    <p-button label="Сохранить" (onClick)="save()" [disabled]="!formValid">
    </p-button>
    <p-button label="Отмена" severity="secondary" (onClick)="this.visible = false">
    </p-button>
  </ng-template>
</p-dialog>
