<p-dialog [header]="header()">
  <form ngForm="form">
    @let mode = this.mode();
    @switch (mode) {
      @case ('login') {
        <ng-container *ngTemplateOutlet="loginForm"></ng-container>
      }
      @case ('register') {
        <ng-container *ngTemplateOutlet="registrationForm"></ng-container>
      }
    }
  </form>
  <ng-template #footer>
    <p-button label="Войти" (onClick)="login()"></p-button>
  </ng-template>
</p-dialog>

<ng-template #loginForm>
  <div class="form-row">
    <label for="login">Email</label>
    <input pInputText id="email" name="email" [(ngModel)]="res!.email" />
  </div>
  <div class="form-row">
    <label for="password">Пароль</label>
    <p-password id="password" name="password" [(ngModel)]="res!.password" />
  </div>
</ng-template>
<ng-template #registrationForm></ng-template>
