<form #form="ngForm" class="prolegacy-form">
  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      required
      style="width: 100%"
      id="lastnameInput"
      name="lastname"
      maxlength="20"
      pattern="^[a-zA-Zа-яА-Я]*$"
      [disabled]="disabled()"
      [(ngModel)]="user().lastname">
    <label for="lastnameInput" class="required">Фамилия</label>
  </p-floatlabel>

  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      required
      style="width: 100%"
      name="firstname"
      id="firstnameInput"
      maxlength="15"
      pattern="^[a-zA-Zа-яА-Я]*$"
      [disabled]="disabled()"
      [(ngModel)]="user().firstname">
    <label for="firstnameInput" class="required">Имя</label>
  </p-floatlabel>

  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      style="width: 100%"
      id="surnameInput"
      name="surname"
      maxlength="20"
      pattern="^[a-zA-Zа-яА-Я]*$"
      [disabled]="disabled()"
      [(ngModel)]="user().surname">
    <label for="surnameInput">Отчество (если есть)</label>
  </p-floatlabel>

  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      required
      style="width: 100%"
      id="emailInput"
      name="email"
      type="email"
      maxlength="40"
      [pattern]="'^[\\w-\.]+@([\\w-]+\.)+[\\w-]{2,4}$'"
      [disabled]="disabled() || !emailRequired()"
      [(ngModel)]="user().email">
    <label for="emailInput" [class.required]="emailRequired()">Адрес электронной почты</label>
  </p-floatlabel>

  @switch (mode()) {
    @case ('edit') {
      <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
        <p-password
          required
          inputId="currentPasswordInput"
          name="currentPassword"
          style="width: 100%"
          [fluid]="true"
          [toggleMask]="true"
          [feedback]="false"
          [maxlength]="50"
          [disabled]="disabled()"
          [ngModel]="currentPassword"
          (ngModelChange)="onCurrentPasswordChange($event)">
        </p-password>
        <label for="currentPasswordInput" class="required">Текущий пароль</label>
      </p-floatlabel>

      <div class="change-password-select-wrapper">
        <label id="changePasswordSwitchLabel" class="change-password-select-label">Изменить пароль?</label>
        <p-select-button name="changePassword"
                         optionLabel="label"
                         optionValue="value"
                         ariaLabelledBy="changePasswordSwitchLabel"
                         [class]="'change-password-select'"
                         [styleClass]="'change-password-select-option'"
                         [allowEmpty]="false"
                         [fluid]="true"
                         [options]="changePasswordOptions"
                         [ngModel]="changePassword"
                         (ngModelChange)="onChangePasswordChange($event)">
        </p-select-button>
      </div>

      @if (changePassword) {
        <div class="expand-container" animate.enter="expand" animate.leave="shrink">
          <div class="expand-content prolegacy-form" style="padding-top: 5px">
            <ng-container *ngTemplateOutlet="passwordInputs"></ng-container>
          </div>
        </div>
      }
    }
    @case ('registration') {
      <ng-container *ngTemplateOutlet="passwordInputs"></ng-container>
    }
    @case ('adminCreate')
    @case ('adminEdit') {
      <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
        <p-select name="role"
                  appendTo="body"
                  optionLabel="localeName"
                  inputId="roleSelect"
                  [options]="roles()"
                  [ngModel]="userRole"
                  [fluid]="true"
                  [required]="true"
                  (ngModelChange)="$event != null ? user().roles = [$event] : user().roles = []">
        </p-select>
        <label for="roleSelect" class="required">Роль:</label>
      </p-floatlabel>
    }
  }

  <ng-template #passwordInputs>
    <div>
      <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
        <p-password #passwordModel="ngModel"
                    required
                    inputId="passwordInput"
                    name="password"
                    style="width: 100%"
                    [fluid]="true"
                    [toggleMask]="true"
                    [feedback]="false"
                    [minlength]="8"
                    [maxlength]="50"
                    [disabled]="disabled()"
                    [(ngModel)]="user().password">
        </p-password>
        <label for="passwordInput" class="required">{{ mode() === 'edit' ? 'Новый пароль' : 'Пароль' }}</label>
      </p-floatlabel>
      @if (passwordModel.dirty && passwordModel.hasError('minlength')) {
        <pro-legacy-form-message message="Пароль должен содержать минимум 8 символов"></pro-legacy-form-message>
      }
    </div>

    <div>
      <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
        <p-password #passwordAgainModel="ngModel"
                    required
                    inputId="passwordAgainInput"
                    name="passwordAgain"
                    style="width: 100%"
                    [proLegacyPasswordsMatch]="user().password"
                    [fluid]="true"
                    [toggleMask]="true"
                    [feedback]="false"
                    [maxlength]="50"
                    [disabled]="disabled()"
                    [(ngModel)]="passwordAgain">
        </p-password>
        <label for="passwordAgainInput"
               class="required"> {{ mode() === 'edit' ? 'Повторите новый пароль' : 'Повторите пароль' }}</label>
      </p-floatlabel>
      @if (passwordAgainModel.dirty && passwordAgainModel.hasError('passwordMismatch')) {
        <pro-legacy-form-message message="Пароли не совпадают"></pro-legacy-form-message>
      }
    </div>
  </ng-template>
</form>
