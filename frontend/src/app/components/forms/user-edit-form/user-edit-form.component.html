<form #form="ngForm" class="prolegacy-form">
  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      required
      style="width: 100%"
      id="lastnameInput"
      name="lastname"
      maxlength="20"
      pattern="^[a-zA-Zа-яА-Я]*$"
      [disabled]="disabled()"
      [(ngModel)]="user().lastname">
    <label for="lastnameInput" class="required">Фамилия</label>
  </p-floatlabel>

  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      required
      style="width: 100%"
      name="firstname"
      id="firstnameInput"
      maxlength="15"
      pattern="^[a-zA-Zа-яА-Я]*$"
      [disabled]="disabled()"
      [(ngModel)]="user().firstname">
    <label for="firstnameInput" class="required">Имя</label>
  </p-floatlabel>

  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      style="width: 100%"
      id="surnameInput"
      name="surname"
      maxlength="20"
      pattern="^[a-zA-Zа-яА-Я]*$"
      [disabled]="disabled()"
      [(ngModel)]="user().surname">
    <label for="surnameInput">Отчество (если есть)</label>
  </p-floatlabel>

  <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
    <input
      pInputText
      required
      style="width: 100%"
      id="emailInput"
      name="email"
      type="email"
      maxlength="40"
      [pattern]="'^[\\w-\.]+@([\\w-]+\.)+[\\w-]{2,4}$'"
      [disabled]="disabled() || isEditMode()"
      [(ngModel)]="user().email">
    <label for="emailInput" [class.required]="!isEditMode()">Адрес электронной почты</label>
  </p-floatlabel>

  @if (isEditMode()) {
    <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
      <p-password
        required
        inputId="currentPasswordInput"
        name="currentPassword"
        style="width: 100%"
        [inputStyle]="{width: '100%'}"
        [toggleMask]="true"
        [feedback]="false"
        [maxlength]="50"
        [disabled]="disabled()"
        [ngModel]="currentPassword"
        (ngModelChange)="onCurrentPasswordChange($event)">
      </p-password>
      <label for="currentPasswordInput" class="required">Текущий пароль</label>
    </p-floatlabel>

    <div class="change-password-select-wrapper">
      <label id="changePasswordSwitchLabel" class="change-password-select-label">Изменить пароль?</label>
      <p-selectbutton fluid
                      name="changePassword"
                      optionLabel="label"
                      optionValue="value"
                      ariaLabelledBy="changePasswordSwitchLabel"
                      [class]="'change-password-select'"
                      [styleClass]="'change-password-select-option'"
                      [allowEmpty]="false"
                      [options]="changePasswordOptions"
                      [ngModel]="changePassword"
                      (ngModelChange)="onChangePasswordChange($event)">
      </p-selectbutton>
    </div>

    @if (changePassword) {
      <div class="expand-container" animate.enter="expand" animate.leave="shrink">
        <div class="expand-content prolegacy-form" style="padding-top: 5px">
          <ng-container *ngTemplateOutlet="passwordInputs"></ng-container>
        </div>
      </div>
    }
  } @else {
    <ng-container *ngTemplateOutlet="passwordInputs"></ng-container>
  }

  <ng-template #passwordInputs>
    <div>
      <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
        <p-password #passwordModel="ngModel"
                    required
                    inputId="passwordInput"
                    name="password"
                    style="width: 100%"
                    [inputStyle]="{width: '100%'}"
                    [toggleMask]="true"
                    [feedback]="false"
                    [minlength]="8"
                    [maxlength]="50"
                    [disabled]="disabled()"
                    [(ngModel)]="user().password">
        </p-password>
        <label for="passwordInput" class="required">{{ isEditMode() ? 'Новый пароль' : 'Пароль' }}</label>
      </p-floatlabel>
      @if (passwordModel.dirty && passwordModel.hasError('minlength')) {
        <pro-legacy-form-message message="Пароль должен содержать минимум 8 символов"></pro-legacy-form-message>
      }
    </div>

    <div>
      <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
        <p-password #passwordAgainModel="ngModel"
                    required
                    inputId="passwordAgainInput"
                    name="passwordAgain"
                    style="width: 100%"
                    [proLegacyPasswordsMatch]="user().password"
                    [inputStyle]="{width: '100%'}"
                    [toggleMask]="true"
                    [feedback]="false"
                    [maxlength]="50"
                    [disabled]="disabled()"
                    [(ngModel)]="passwordAgain">
        </p-password>
        <label for="passwordAgainInput" class="required"> {{ isEditMode() ? 'Повторите новый пароль' : 'Повторите пароль' }}</label>
      </p-floatlabel>
      @if (passwordAgainModel.dirty && passwordAgainModel.hasError('passwordMismatch')) {
        <pro-legacy-form-message message="Пароли не совпадают"></pro-legacy-form-message>
      }
    </div>
  </ng-template>
</form>
