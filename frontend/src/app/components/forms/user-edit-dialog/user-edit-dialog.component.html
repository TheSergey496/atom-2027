<p-dialog header="Управление аккаунтом" [style]="{ width: '480px' }" [modal]="true">

  <div style="height: 10px"></div>
  <pro-legacy-user-edit-form [user]="user"
                             [isEditMode]="true"
                             (validityChange)="formValid = $event"
                             (currentPasswordChange)="currentPassword = $event">
  </pro-legacy-user-edit-form>

  <ng-template #footer>
    <p-button label="Сохранить" (onClick)="save()" [disabled]="!formValid">
    </p-button>
    <p-button label="Закрыть" severity="secondary" (onClick)="this.visible = false">
    </p-button>
  </ng-template>
</p-dialog>
