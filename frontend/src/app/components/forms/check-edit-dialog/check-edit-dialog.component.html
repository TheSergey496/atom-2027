<p-dialog [header]="header()" [style]="{ width: '480px' }" [modal]="true" [focusOnShow]="false">

    <form #form="ngForm" class="prolegacy-form">
        <div style="height: 10px"></div>

        <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
            <p-select name="checkType"
                      appendTo="body"
                      optionLabel="label"
                      optionValue="value"
                      inputId="typeSelect"
                      [disabled]="readOnlyMode()"
                      [options]="checkTypes()"
                      [filter]="true"
                      [showClear]="true"
                      [(ngModel)]="check.checkType"
                      [fluid]="true"
                      [required]="true">
            </p-select>
            <label for="typeSelect" [class.required]="!readOnlyMode()">Вид проверки</label>
        </p-floatlabel>

        <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
            <p-auto-complete name="edifice"
                             appendTo="body"
                             optionLabel="name"
                             inputId="edificeSelect"
                             dataKey="id"
                             [disabled]="readOnlyMode()"
                             [suggestions]="edificeSuggestions()"
                             [(ngModel)]="check.edifice"
                             (completeMethod)="edificeCompleteMethod($event)"
                             [showClear]="true"
                             [dropdown]="true"
                             [fluid]="true"
                             [required]="true">
            </p-auto-complete>
            <label for="edificeSelect" [class.required]="!readOnlyMode()">Объект проверки</label>
        </p-floatlabel>

        <div>
        <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
            <p-date-picker inputId="planDatePicker"
                           name="planDate"
                           appendTo="body"
                           pInputMask="99.99.9999 99:99"
                           [placeholder]="readOnlyMode() ? 'Не задано' : undefined"
                           [disabled]="readOnlyMode()"
                           [showIcon]="true"
                           [ngModel]="check.planDate"
                           (ngModelChange)="onPlanDateChange($event)"
                           [showTime]="true"
                           [fluid]="true"
                           [showOnFocus]="false"
                           [hourFormat]="'24'"
                           [required]="true"/>
            <label for="planDatePicker" [class.required]="!readOnlyMode()">Плановая дата проверки</label>
        </p-floatlabel>
            @if (!dateValid()) {
                <pro-legacy-form-message message="Плановая дата проверки обязана быть в будущем"></pro-legacy-form-message>
            }
        </div>

        <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
            <p-auto-complete name="responsible"
                             appendTo="body"
                             optionLabel="fullName"
                             inputId="responsibleSelect"
                             dataKey="id"
                             [placeholder]="readOnlyMode() ? 'Не задано' : undefined"
                             [disabled]="readOnlyMode()"
                             [suggestions]="employeeSuggestions()"
                             [dropdown]="true"
                             [(ngModel)]="check.responsible"
                             [showClear]="true"
                             (completeMethod)="employeeCompleteMethod($event)"
                             [fluid]="true">
            </p-auto-complete>
            <label for="responsibleSelect">Ответственный за проведение проверки</label>
        </p-floatlabel>

        @if (readOnlyMode()) {
            <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
              <textarea pTextarea
                        id="commentTextArea"
                        style="max-height: 300px"
                        name="comment"
                        [placeholder]="''"
                        [disabled]="true"
                        [fluid]="true"
                        [autoResize]="true"
                        [(ngModel)]="check.comment">
              </textarea>
                <label for="commentTextArea">Комментарий к проверке</label>
            </p-floatlabel>
        } @else {
            <p-floatlabel proLegacyFloatLabelTransitionFix variant="on">
              <textarea pTextarea
                        id="commentTextArea"
                        style="max-height: 300px"
                        name="comment"
                        [fluid]="true"
                        [autoResize]="true"
                        [(ngModel)]="check.comment">
              </textarea>
                <label for="commentTextArea">Комментарий к проверке</label>
            </p-floatlabel>
        }

    </form>

    <ng-template #footer>
        @if (!readOnlyMode()) {
            <p-button label="Сохранить" (onClick)="save()" [disabled]="form.invalid || !dateValid()">
            </p-button>
            <p-button label="Отмена" severity="secondary" (onClick)="this.visible = false">
            </p-button>
        } @else {
            <p-button label="Закрыть" (onClick)="this.visible = false" [disabled]="form.invalid">
            </p-button>
        }
    </ng-template>
</p-dialog>
