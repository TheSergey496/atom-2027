<div class="v-flex">
    <p-toolbar>
        <ng-template #start>
            <div class="table-title">
                Бригады ({{ count() }})
            </div>
            <div class="splitter"></div>
            <p-button label="Рассчитать" icon="pi pi-hammer" (onClick)="formBrigades()"></p-button>
            <p-button icon="pi-file" pTooltip="Выгрузить бригады" (onClick)="exportJson()"></p-button>
        </ng-template>
        <ng-template #end>
            <pro-legacy-table-fast-search [table]="table">
            </pro-legacy-table-fast-search>
        </ng-template>
    </p-toolbar>
    <pro-legacy-tree-table #table
                           class="v-flex-grow"
                           [value]="data()"
                           [columns]="columns()"
                           [getRowId]="getRowId">
    </pro-legacy-tree-table>
</div>
