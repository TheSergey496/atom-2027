<div #wrapper style="width: 100%; height: 100%;">
    <p-splitter style="width: 100%; height: 100%" [panelSizes]="[75, 25]">
        <ng-template #panel>
            <ng-diagram
                    [model]="model"
                    [edgeTemplateMap]="edgeTemplateMap"
                    [nodeTemplateMap]="nodeTemplateMap"
                    [config]="config"
                    (selectionChanged)="selectionChange($event)"
            (selectionMoved)="saveGraphState()"/>
            <ng-diagram-minimap position="bottom-left" />
        </ng-template>
        <ng-template #panel>
            <pro-legacy-events [forEdifice]="true" [edifice]="selectedNode()?.data"></pro-legacy-events>
        </ng-template>
    </p-splitter>
</div>
