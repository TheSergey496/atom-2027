<div #wrapper style="width: 100%; height: 100%;">
    <p-splitter style="width: 100%; height: 100%" [class.hidden-right]="selectedNode() == null">
        <ng-template #panel>
            <ng-diagram

                    [model]="model"
                    [edgeTemplateMap]="edgeTemplateMap"
                    [config]="config"
                    (selectionChanged)="selectionChange($event)"/>
        </ng-template>
        <ng-template #panel>
        </ng-template>
    </p-splitter>
</div>
