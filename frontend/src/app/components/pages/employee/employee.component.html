<p-splitter style="width: 100%; height: 100%" layout="vertical" [panelSizes]="[70, 30]">
    <ng-template #panel>
        <div class="v-flex">
            <p-toolbar>
                <ng-template #start>
                    <div class="table-title">
                        {{ table.getTitle('Рабочие') }}
                    </div>

                    <p-button icon="pi pi-sync"
                              size="small"
                              (onClick)="loadData()">
                    </p-button>
                    <p-button icon="pi pi-filter"
                              size="small"
                              (onClick)="filter.set(!filter())">
                    </p-button>

                    <div class="splitter"></div>

                    <p-button size="small"
                              severity="success"
                              icon="pi pi-file-excel"
                              [disabled]="loading()"
                              (onClick)="table.exportToExcel()">
                    </p-button>
                </ng-template>

                <ng-template #end>
                    <pro-legacy-table-fast-search [table]="table">
                    </pro-legacy-table-fast-search>
                </ng-template>
            </p-toolbar>
            <pro-legacy-table #table
                              class="v-flex-grow"
                              [defaultSort]="[{field: 'id', order: -1}]"
                              [columns]="columns()"
                              [value]="employees()"
                              [filter]="filter()"
                              [loading]="loading()"
                              [getRowId]="getRowId"
                              [(selection)]="selectedEmployee"
                              (selectionChange)="loadDetailData()">
            </pro-legacy-table>
        </div>
    </ng-template>

    <ng-template #panel>
        <div class="v-flex">
            <p-toolbar>
                <ng-template #start>
                    <div class="table-title">
                        {{ detailTable.getTitle('Квалификации') }}
                    </div>

                    <p-button icon="pi pi-sync"
                              size="small"
                              (onClick)="loadDetailData()">
                    </p-button>
                    <p-button icon="pi pi-filter"
                              size="small"
                              (onClick)="detailFilter.set(!detailFilter())">
                    </p-button>

                    <div class="splitter"></div>

                    <p-button size="small"
                              severity="success"
                              icon="pi pi-file-excel"
                              [disabled]="detailLoading()"
                              (onClick)="detailTable.exportToExcel()">
                    </p-button>
                </ng-template>

                <ng-template #end>
                    <pro-legacy-table-fast-search [table]="detailTable">
                    </pro-legacy-table-fast-search>
                </ng-template>
            </p-toolbar>
            <pro-legacy-table #detailTable
                              class="v-flex-grow"
                              [defaultSort]="[{field: 'id', order: -1}]"
                              [columns]="detailColumns()"
                              [value]="employeeQualifications()"
                              [filter]="detailFilter()"
                              [loading]="detailLoading()"
                              [getRowId]="detailGetRowId">
            </pro-legacy-table>
        </div>
    </ng-template>

</p-splitter>
