<div class="v-flex">
    <p-toolbar>
        <ng-template #start>
            <div class="table-title">
                {{ this.edifice() == null ? table.getTitle('События') : table.getTitle('События на объекте: ' + this.edifice()!.name) }}
            </div>

            <p-button icon="pi pi-sync"
                      size="small"
                      (onClick)="loadData()">
            </p-button>
            <p-button icon="pi pi-filter"
                      size="small"
                      (onClick)="filter.set(!filter())">
            </p-button>

            <div class="splitter"></div>

            <p-button size="small"
                      severity="success"
                      icon="pi pi-file-excel"
                      [disabled]="loading()"
                      (onClick)="table.exportToExcel()">
            </p-button>
        </ng-template>

        <ng-template #end>

            <p-select-button optionLabel="label"
                             optionValue="value"
                             size="small"
                             [allowEmpty]="false"
                             [options]="showArchivedOptions"
                             [ngModel]="showArchived"
                             (ngModelChange)="onShowArchivedChange($event)">
            </p-select-button>

            <div class="splitter"></div>

            <pro-legacy-table-fast-search [table]="table">
            </pro-legacy-table-fast-search>
        </ng-template>
    </p-toolbar>
    <pro-legacy-table #table
                      class="v-flex-grow"
                      [defaultSort]="[{field: 'id', order: -1}]"
                      [columns]="columns()"
                      [value]="events()"
                      [filter]="filter()"
                      [loading]="loading()"
                      [getRowId]="getRowId">
    </pro-legacy-table>
</div>
